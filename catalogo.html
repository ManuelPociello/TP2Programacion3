<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/db-logo.png">
  <title>Dragon Ball App - Personajes</title>
</head>
<body>
  <header>
    <h1>Dragon Ball App - Catálogo</h1>
    <nav>
      <a href="./index.html">Inicio</a>
      <a href="./catalogo.html">Catálogo</a>
    </nav>
  </header>

  <main class="catalogo-main">
    <h2>Catálogo de Personajes</h2>

    <!-- Formulario simplificado que se envía al presionar Enter -->
    <form id="form-filtros" class="form-filtros">
      <div class="form-grupo">
        <label for="search-busqueda" id="label-busqueda">Buscar personaje por nombre:</label>
        <input type="search" id="search-busqueda" placeholder="Ej. Goku, Vegeta, Piccolo..." autocomplete="off"/>
      </div>
    </form>
    
    <!-- Contenedor para estados (Cargando / Error) -->
    <div id="estado-mensaje"></div>

    <!-- Grilla donde JavaScript insertará las tarjetas de forma segura -->
    <section id="grilla-catalogo" class="grid-tarjetas">
      <!-- Las tarjetas se generan dinámicamente con JS -->
    </section>

    <div id="paginacion" class="paginacion-container"></div>
  </main>

  <footer>
    <p>Programación III - UTN San Nicolás | Año 2026 | API: The Dragon Ball API</p>
  </footer>

  <script type="module" src="./src/catalogo.js"></script>
</body>
</html>
